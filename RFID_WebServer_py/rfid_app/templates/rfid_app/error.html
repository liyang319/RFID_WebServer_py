<!-- rfid_app/templates/rfid_app/error.html -->
<!DOCTYPE html>
<html>
<head>
    <title>系统错误</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; background: #f8f9fa; padding: 20px; }
        .error-container { max-width: 800px; margin: 50px auto; }
        .error-card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="card error-card">
            <div class="card-header bg-danger text-white">
                <i class="bi bi-exclamation-triangle"></i> 系统错误
            </div>
            <div class="card-body">
                <h4 class="card-title">页面加载失败</h4>
                <p class="card-text text-muted">{{ error_message }}</p>

                <div class="alert alert-info mt-4">
                    <h5><i class="bi bi-lightbulb"></i> 解决方案</h5>
                    <ol>
                        <li>运行数据库迁移：<code>python manage.py migrate</code></li>
                        <li>如果迁移失败：<code>python manage.py makemigrations rfid_app</code></li>
                        <li>重启Django服务</li>
                        <li><a href="/" class="alert-link">返回首页</a></li>
                    </ol>
                </div>

                <div class="mt-4">
                    <a href="/" class="btn btn-primary">
                        <i class="bi bi-house"></i> 返回首页
                    </a>
                    <button class="btn btn-secondary" onclick="location.reload()">
                        <i class="bi bi-arrow-clockwise"></i> 刷新页面
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
